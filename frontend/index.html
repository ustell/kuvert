<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + Vue + TS</title>
  </head>
  <body>
    <body>
      <div id="app">
        <!-- красивый прелоадер пока ждём boot() -->
        <div id="boot">
          <div class="boot-card">
            <div class="boot-spinner"></div>
            <div class="boot-title">Загрузка приложения</div>
          </div>
        </div>
      </div>
    </body>

    <style>
      :root {
        --boot-card-bg: #11162a;
        --boot-muted: #8b94a7;
        --boot-fg: #e6e9f2;
        --boot-accent: #7db3ff;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --boot-bg: radial-gradient(1200px 800px at 30% 10%, #6ea8fe22, transparent),
            radial-gradient(1000px 700px at 80% 90%, #20c99722, transparent),
            linear-gradient(180deg, #f7f8fb, #eef1f6);
          --boot-card-bg: #fff;
          --boot-muted: #667085;
          --boot-fg: #1f2a44;
          --boot-accent: #3b82f6;
        }
      }

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--boot-bg);
        z-index: 9999;
        padding: 24px;
        overflow: hidden;
      }
      .boot-card {
        width: min(420px, 92vw);
        padding: 28px 24px 22px;
        border-radius: 16px;
        transform: translateY(10px);
        animation: boot-pop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.05s both;
      }
      @keyframes boot-pop {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .boot-spinner {
        --size: 42px;
        width: var(--size);
        height: var(--size);
        margin: 4px auto 14px;
        border-radius: 50%;
        border: 3px solid #ffffff22;
        border-top-color: var(--boot-accent);
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .boot-title {
        text-align: center;
        color: var(--boot-fg);
        font: 600 16px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell,
          'Helvetica Neue', Arial;
        letter-spacing: 0.2px;
      }

      /* уважение к тем, кто отключил анимации */
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner,
        .boot-dots i,
        .boot-progress .bar {
          animation: none;
        }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
